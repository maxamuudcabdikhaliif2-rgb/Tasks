 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #e92917;
    color: white;
}

header {
    background: #111c2e;
    border-bottom: 1px solid #ffffff20;
    position: sticky;
    top: 0;
    z-index: 1000;
}

nav {
    max-width: 1150px;
    min-height: 75px;
    margin: auto;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: white;
    text-decoration: none;
}

.logo span {
    color: #00e5ff;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 30px;
    list-style: none;
}

.nav-links a {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 15px;
    transition: .3s;
}

.nav-links a:hover,
.nav-links a.active {
    color: #00e5ff;
}

.contact-btn {
    padding: 10px 18px;
    border: 1px solid #00e5ff;
    border-radius: 7px;
    color: #00e5ff !important;
}

.contact-btn:hover {
    background: #00e5ff;
    color: #101827 !important;
}

.menu-btn {
    display: none;
    background: none;
    border: none;
    color: white;
    font-size: 27px;
    cursor: pointer;
}

/* MOBILE */
@media (max-width: 700px) {
    .menu-btn {
        display: block;
    }

    .nav-links {
        position: absolute;
        top: 75px;
        left: 0;
        width: 100%;
        background: #111c2e;
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 15px 20px;
    }

    .nav-links.show {
        display: flex;
    }

    .nav-links a {
        display: block;
        padding: 13px;
    }

    .contact-btn {
        text-align: center;
        margin-top: 8px;
    }
}
</style>
</head>

<body>

<header>
    <nav>
        <a href="#home" class="logo">My<span>Projects.</span></a>

        <button class="menu-btn" id="menuBtn">☰</button>

        <ul class="nav-links" id="navLinks">
            <li><a href="./rock,p,s.html" class="active">rock</a></li>
            <li><a href="./portfio.html">Portfolio</a></li>
            <li><a href="./memory,c.html">Memory</a></li>
            <li><a href="./evc.html">EVC Plus</a></li>
        </ul>
    </nav>
</header>

<script>
const menuBtn = document.getElementById("menuBtn");
const navLinks = document.getElementById("navLinks");

menuBtn.addEventListener("click", () => {
    navLinks.classList.toggle("show");

    menuBtn.textContent =
        navLinks.classList.contains("show") ? "✕" : "☰";
});

document.querySelectorAll(".nav-links a").forEach(link => {
    link.addEventListener("click", () => {
        document.querySelector(".nav-links a.active")
            ?.classList.remove("active");

        link.classList.add("active");

        navLinks.classList.remove("show");
        menuBtn.textContent = "☰";
    });
});
</script>

</body>
</html>
